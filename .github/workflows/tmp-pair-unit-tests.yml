name: Pair unit tests (temporary)

on:
  push:
    branches: [feature/pair-training]

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit tests
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("iPhone [0-9]+ Pro Max"))] | sort_by(.name) | last | .udid')
          set +e
          xcodebuild test \
            -project ApexPerformance.xcodeproj \
            -scheme ApexPerformance \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:ApexPerformanceTests/TrainingSessionTests \
            -only-testing:ApexPerformanceTests/DemoAPITests \
            -parallel-testing-enabled NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE= > test.log 2>&1
          result=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed" test.log | tail -60
          exit $result
