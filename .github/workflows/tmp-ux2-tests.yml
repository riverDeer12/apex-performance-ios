# Temporary: unit tests of the feature branch (removed before merging).
name: UX2 unit tests

on:
  push:
    branches: [feature/ux-round-2]

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit tests and UI test build
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("iPhone [0-9]+ Pro Max"))] | sort_by(.name) | last | .udid')
          set +e
          xcodebuild test \
            -project ApexPerformance.xcodeproj \
            -scheme ApexPerformance \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:ApexPerformanceTests \
            -parallel-testing-enabled NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE= > unit-test.log 2>&1
          result=$?
          grep -E "error:|Test Case .* failed|Executed" unit-test.log | sort -u | head -60
          exit $result
