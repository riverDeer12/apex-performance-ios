name: App Store screenshots

# Runs AppStoreScreenshotTests on an iPhone (6.9") and an iPad (13")
# simulator and pushes the PNGs to the store-screenshots branch.
# The app runs with invented demo data (DemoAPI), so no server or
# accounts are needed and no real people are shown.
# Started by hand (Actions -> App Store screenshots -> Run workflow) and
# by every App Store build (TestFlight workflow with app: store).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Every demo response must decode into the app's models,
      # otherwise screens would show errors instead of data.
      - name: Check the demo data
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("iPhone [0-9]+ Pro Max"))] | sort_by(.name) | last | .udid')
          set +e
          xcodebuild test \
            -project ApexPerformance.xcodeproj \
            -scheme ApexPerformance \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:ApexPerformanceTests/DemoAPITests \
            -parallel-testing-enabled NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE= > demo-test.log 2>&1
          result=$?
          if [ "$result" != "0" ]; then
            lines=$(grep -E ": error: |error:" demo-test.log | sed 's/^.*error: //' | sort -u | head -20)
            echo "::error::Demo data check failed:%0A$(echo "$lines" | awk 'BEGIN { ORS = "%0A" } 1')"
            exit 1
          fi

      - name: Take screenshots
        run: |
          # Newest iPhone Pro Max (6.9") and iPad Pro 13-inch available.
          devices=$(xcrun simctl list devices available -j)
          iphone=$(echo "$devices" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("iPhone [0-9]+ Pro Max"))] | sort_by(.name) | last | .udid')
          ipad=$(echo "$devices" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("iPad Pro 13"))] | sort_by(.name) | last | .udid')
          echo "::notice::iPhone $iphone, iPad $ipad"

          mkdir -p screenshots
          status=0
          # Signed to run locally ("-"), not unsigned: the app keeps the
          # login token in the keychain, which needs a signed app.
          for udid in "$iphone" "$ipad"; do
            [ "$udid" = "null" ] && continue
            name=$(xcrun simctl list devices -j | jq -r --arg u "$udid" '.devices[][] | select(.udid == $u) | .name')
            xcrun simctl boot "$udid" || true
            # Clean status bar: 9:41, full battery and signal.
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 \
              --cellularMode active --cellularBars 4 --wifiBars 3 || true
            set +e
            xcodebuild test \
              -project ApexPerformance.xcodeproj \
              -scheme ApexPerformance \
              -destination "platform=iOS Simulator,id=$udid" \
              -only-testing:ApexPerformanceUITests/AppStoreScreenshotTests \
              -parallel-testing-enabled NO \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE= > "test-$udid.log" 2>&1
            result=$?
            grep -E "Test Case|error:|XCTSkip|skipped" "test-$udid.log" || true
            set -e
            if [ "$result" != "0" ]; then
              status=1
              # One annotation per device, GitHub keeps only ten per step.
              lines=$(grep -E ": error: |XCTSkip|Skipped|skipped" "test-$udid.log" | sed 's/^.*: error: //' | sort -u | head -15)
              echo "::error::$name failed:%0A$(echo "$lines" | awk 'BEGIN { ORS = "%0A" } 1')"
            fi
            # The test writes to ~/Desktop/ApexScreenshots/<device> on the Mac.
            for dir in "$HOME/Desktop/ApexScreenshots"/*; do
              [ -d "$dir" ] || continue
              mkdir -p "screenshots/$name"
              cp "$dir"/*.png "screenshots/$name/" 2>/dev/null || true
              rm -rf "$dir"
            done
          done
          ls -R screenshots
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Push the screenshots
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "::error::No screenshots were taken."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan store-screenshots
          git rm -rq --cached .
          git add screenshots
          git commit -qm "App Store screenshots of ${GITHUB_SHA::7}"
          git push -f origin store-screenshots
          if [ "$status" != "0" ]; then
            echo "::warning::Some screenshot tests failed, see the errors above."
          fi

      # The set for App Store Connect, in the order it is shown there:
      # new features first. Downloadable as a ZIP from the run's page.
      - name: Make the App Store set
        run: |
          order="client-*-cooperation-rules client-*-training-details client-*-language
            client-*-workout-muscles client-*-chat client-*-home client-*-notifications
            client-*-body-progress coach-*-appointments coach-*-clients"
          for device in screenshots/*; do
            name=$(basename "$device")
            case "$name" in iPad*) target="AppStore/iPad 13" ;; *) target="AppStore/iPhone 6.9" ;; esac
            mkdir -p "$target"
            n=1
            for pattern in $order; do
              file=$(ls "$device"/$pattern.png 2>/dev/null | head -1)
              [ -n "$file" ] || continue
              cp "$file" "$target/$(printf %02d $n)-$(basename "$file" | sed -E 's/^(client|coach)-[0-9]+-/\1-/')"
              n=$((n + 1))
            done
          done
          ls -R AppStore

      - name: Keep the App Store set
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-screenshots
          path: AppStore
